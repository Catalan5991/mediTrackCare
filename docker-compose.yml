services:
  postgres:
    image: postgres:17-alpine
    container_name: Postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meditrackcare}
      POSTGRES_USER: ${POSTGRES_USER:-meditrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.production}
    volumes:
      - meditrackcare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meditrack} -d ${POSTGRES_DB:-meditrackcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meditrack-api:
    container_name: meditrack-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL  en .env.production}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  meditrackcare_postgres:
